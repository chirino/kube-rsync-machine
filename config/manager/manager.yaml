apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-rsync-machine-controller-manager
  labels:
    app.kubernetes.io/name: kube-rsync-machine
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/part-of: kube-rsync-machine
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-rsync-machine
      app.kubernetes.io/component: controller-manager
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-rsync-machine
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/part-of: kube-rsync-machine
        control-plane: controller-manager
    spec:
      serviceAccountName: kube-rsync-machine-controller-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/chirino/kube-rsync-machine:latest
          imagePullPolicy: IfNotPresent
          args:
            - manager
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: live-api
              containerPort: 8082
              protocol: TCP
            - name: control-grpc
              containerPort: 8083
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
