apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: restorejobs.krm.chirino.github.io
spec:
  group: krm.chirino.github.io
  scope: Namespaced
  names:
    plural: restorejobs
    singular: restorejob
    kind: RestoreJob
    shortNames: [rj]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Source
          type: string
          jsonPath: .spec.sourceRef.name
        - name: Snapshot
          type: string
          jsonPath: .status.restoredSnapshot
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: RestoreJob restores one BackupSource restore point into a destination PVC.
              required: [sourceRef]
              properties:
                sourceRef:
                  type: object
                  description: BackupSource to restore from.
                  required: [name]
                  properties:
                    namespace:
                      type: string
                      description: Namespace of the referenced source. Defaults to the RestoreJob namespace.
                    name:
                      type: string
                      description: Name of the referenced source.
                      minLength: 1
                snapshot:
                  type: string
                  description: Restore point to restore. Defaults to latest.
                overrides:
                  type: object
                  description: Per-restore destination and rsync overrides.
                  properties:
                    destination:
                      type: object
                      description: Destination override for this restore.
                      properties:
                        namespace:
                          type: string
                          description: Namespace containing the destination PVC. Defaults to the RestoreJob namespace and cannot name a different namespace.
                        pvcName:
                          type: string
                          description: Destination PVC to mount and restore into.
                        path:
                          type: string
                          description: Path inside the destination PVC.
                    rsync:
                      type: object
                      description: Rsync options for this restore.
                      properties:
                        delete:
                          type: boolean
                          description: Delete destination files that no longer exist in the source for this restore.
                        oneFileSystem:
                          type: boolean
                          description: Prevent restore rsync from crossing filesystem mount boundaries.
                nodeSelector:
                  type: object
                  description: Node labels required for generated restore writer jobs.
                  additionalProperties:
                    type: string
                affinity:
                  type: object
                  description: Pod affinity rules for generated restore writer jobs.
                  x-kubernetes-preserve-unknown-fields: true
                tolerations:
                  type: array
                  description: Tolerations for generated restore writer jobs.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                topologySpreadConstraints:
                  type: array
                  description: Topology spread constraints for generated restore writer jobs.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                schedulerName:
                  type: string
                  description: Scheduler name for generated restore writer jobs.
                priorityClassName:
                  type: string
                  description: PriorityClass for generated restore writer jobs.
                runtimeClassName:
                  type: string
                  description: RuntimeClass for generated restore writer jobs.
                imagePullSecrets:
                  type: array
                  description: Image pull secrets for generated restore writer jobs.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Name of the image pull secret.
                securityContext:
                  type: object
                  description: Pod security context for generated restore writer jobs.
                  x-kubernetes-preserve-unknown-fields: true
                resources:
                  type: object
                  description: Container resource requests and limits for generated restore writer jobs.
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Preparing, Running, Finalizing, Succeeded, Failed, Canceled]
                  description: Current restore lifecycle phase.
                startedAt:
                  type: string
                  format: date-time
                  description: Time the restore run started.
                completedAt:
                  type: string
                  format: date-time
                  description: Time the restore run finished.
                restoredSnapshot:
                  type: string
                  description: Resolved immutable restore point used by the restore.
                exitCode:
                  type: integer
                  format: int32
                  description: Exit code reported by the restore writer process.
                message:
                  type: string
                  description: Human-readable restore status or error message.
                transfers:
                  type: array
                  items:
                    type: object
                    required: [source]
                    properties:
                      source:
                        type: string
                        description: Namespace/name of the source.
                      phase:
                        type: string
                        enum: [Pending, Preparing, Running, Succeeded, Failed, Skipped]
                        description: Transfer lifecycle phase.
                      percent:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 100
                        description: Approximate transfer completion percentage.
                      bytesTransferred:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Literal file payload bytes transferred by rsync.
                      rateBytesPerSecond:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Average transfer rate in bytes per second.
                      filesTransferred:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Regular files transferred by rsync.
                      totalFiles:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Total files seen by rsync.
                      totalFileSize:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Total file size reported by rsync.
                      bytesSent:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Bytes sent by the sender process.
                      bytesReceived:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Bytes received by the sender process.
                      speedup:
                        type: number
                        minimum: 0
                        description: Rsync speedup ratio.
                      message:
                        type: string
                        description: Human-readable transfer details.
                      exitCode:
                        type: integer
                        format: int32
                        description: Transfer process exit code.
                      startedAt:
                        type: string
                        format: date-time
                        description: Time this transfer started.
                      completedAt:
                        type: string
                        format: date-time
                        description: Time this transfer finished.
                      captureMethod:
                        type: string
                        enum: [Direct, VolumeSnapshot, Auto]
                        description: Capture method used for this transfer.
                      volumeSnapshotName:
                        type: string
                        description: Temporary VolumeSnapshot used for this transfer.
                      captureTime:
                        type: string
                        format: date-time
                        description: Time the source capture was taken.
                  description: Per-source transfer summaries.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type: {type: string, description: Condition type.}
                      status: {type: string, enum: ["True", "False", Unknown], description: Condition status.}
                      observedGeneration: {type: integer, format: int64, description: Resource generation observed for the condition.}
                      lastTransitionTime: {type: string, format: date-time, description: Time the condition last changed status.}
                      reason: {type: string, description: Machine-readable reason for the condition.}
                      message: {type: string, description: Human-readable condition details.}
                  description: Kubernetes-style conditions for the resource.
              description: Observed state reported by the operator.
