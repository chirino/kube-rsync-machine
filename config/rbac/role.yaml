apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-rsync-machine-manager-role
  labels:
    app.kubernetes.io/name: kube-rsync-machine
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/part-of: kube-rsync-machine
rules:
  - apiGroups:
      - krm.chirino.github.io
    resources:
      - rsyncmachines
      - backupsources
      - backupjobs
      - restorejobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - krm.chirino.github.io
    resources:
      - rsyncmachines/status
      - backupsources/status
      - backupjobs/status
      - restorejobs/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - krm.chirino.github.io
    resources:
      - rsyncmachines/finalizers
      - backupsources/finalizers
      - backupjobs/finalizers
      - restorejobs/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - configmaps
      - events
      - persistentvolumeclaims
      - pods
      - pods/log
      - secrets
      - services
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshotclasses
      - volumesnapshotcontents
      - volumesnapshots
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
