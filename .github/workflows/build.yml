name: build

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/*.gitignore"
      - ".vscode/**"
      - ".github/mergify.yml"

  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/*.gitignore"
      - ".vscode/**"
      - ".github/mergify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: chrino
  IMAGE_NAME: chrino/kube-rsync-machine

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            KRM_VERSION=${{ github.sha }}
            GO_BUILD_FLAGS=
          # platforms: linux/amd64,linux/arm64

  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate image tags
        id: tags
        run: |
          # Generate tags based on branch and commit
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=${GITHUB_SHA:0:7}

          # Create tags array
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_NAME}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_NAME}-${SHORT_SHA}"

          # Add latest tag for main branch
          if [ "$BRANCH_NAME" = "main" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi

          echo "Generated tags: ${TAGS}"
          echo "VERSION=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "TAGS=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          platforms: linux/amd64
          build-args: |
            KRM_VERSION=${{ github.sha }}
            GO_BUILD_FLAGS=
          # platforms: linux/amd64,linux/arm64

      - name: Get image SHA
        id: image-sha
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=${GITHUB_SHA:0:7}         
          IMAGE_SHA=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_NAME}-${SHORT_SHA} --format='{{index .RepoDigests 0}}' 2>/dev/null || echo "Image not found locally")

          if [ "$IMAGE_SHA" = "Image not found locally" ]; then
            IMAGE_SHA=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_NAME} --format='{{index .RepoDigests 0}}' 2>/dev/null || echo "Registry image not found")
          fi

          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_OUTPUT
          echo "Built image SHA: $IMAGE_SHA"

      - name: Log build information
        run: |
          echo "=========================================="
          echo "Build completed successfully!"
          echo "=========================================="
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image Name: ${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.tags.outputs.TAGS }}"
          echo "Image SHA: ${{ steps.image-sha.outputs.IMAGE_SHA }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "=========================================="
